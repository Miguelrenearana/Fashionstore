[project]
name = "fashionstore-api"
version = "0.1.0"
description = "FashionStore API - inteligent clothing store platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "python-multipart==0.0.20",
    "PyJWT==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "pgvector==0.3.6",
    "email-validator==2.2.0",
    "httpx==0.28.1",
    "sentence-transformers==3.3.1",
    "numpy==2.2.0",
    "APScheduler==3.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008: `Depends()`/`Query()` en los defaults de firma es el patron idiomatico de FastAPI.
"app/api/v1/*.py" = ["B008"]
"app/payments/api/v1/*.py" = ["B008"]
"app/core/dependencies.py" = ["B008"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100