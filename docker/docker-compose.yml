version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fashionstore-db
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: fashionstore-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FashionStore;User=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      Jwt__Key: "your-super-secret-key-with-at-least-32-characters"
      Jwt__Issuer: "FashionStore"
      Jwt__Audience: "FashionStore.Client"
      Jwt__ExpiryMinutes: "60"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ../src/FashionStore.Api:/app/src/FashionStore.Api

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: fashionstore-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000/api

volumes:
  sqlserver_data: