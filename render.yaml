services:
  - type: web
    name: fashionstore-api
    runtime: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: PAYMENT_GATEWAY
        value: mock
      - key: CORS_ORIGINS
        value: https://fashionstore.vercel.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
    healthCheckPath: /health
    dockerfilePath: ./backend/Dockerfile